    <path d="M -130,20 C -140,-50 140,-120 150,0 C 160,110 -120,100 -130,20 Z" stroke="#1A252C" stroke-width="26" fill="none"/>
    <path d="M -130,20 C -140,-50 140,-120 150,0 C 160,110 -120,100 -130,20 Z" stroke="#FFFFFF" stroke-width="20" fill="none"/>
    <path d="M -130,20 C -140,-50 140,-120 150,0 C 160,110 -120,100 -130,20 Z" stroke="#1A252C" stroke-width="14" fill="none"/>
    <path d="M -130,20 C -140,-50 140,-120 150,0 C 160,110 -120,100 -130,20 Z" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 10" fill="none"/>

    <!-- International Film Festival Laurel Branch Left & Right -->
    <g stroke="#F1C40F" stroke-width="4" fill="none">
      <!-- Left Laurel -->
      <path d="M -125,50 C -165,10 -140,-70 -90,-110"/>
      <!-- Right Laurel -->
