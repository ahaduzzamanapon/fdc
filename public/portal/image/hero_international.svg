    <path d="M 40,-70 C 70,-60 80,-30 60,-10 C 30,-30 20,-60 40,-70 Z" fill="#2ECC71" opacity="0.85"/>
    
    <!-- Longitude / Latitude Grid Lines -->
    <ellipse cx="0" cy="0" rx="105" ry="40" stroke="#E0F7FA" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
    <ellipse cx="0" cy="0" rx="105" ry="80" stroke="#E0F7FA" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#E0F7FA" stroke-width="2" stroke-dasharray="8 6"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#E0F7FA" stroke-width="2" stroke-dasharray="8 6"/>

